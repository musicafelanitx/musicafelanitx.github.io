<script>
/* Redirigeix les adreces antigues de Google Sites a les noves */
(function () {
  var map = {
    "/estudis/matricula": "/estudis/matricula/",
    "/estudis/proves-dacces": "/estudis/proves-acces/",
    "/estudis/pla-destudis": "/estudis/pla-estudis/",
    "/estudis/pla-destudis/mes-info": "/estudis/pla-estudis/mes-info/",
    "/activitats/chopin-sessions": "/activitats/mallorca-piano-days/",
    "/activitats/chopin-sessions/masterclass": "/activitats/mallorca-piano-days/",
    "/activitats/musica-al-jardi": "/activitats/musica-al-jardi/",
    "/activitats/campus-musica-creativa": "/activitats/campus-musica-creativa/",
    "/conservatori/installacions": "/conservatori/installacions/",
    "/conservatori/avis-legal": "/conservatori/avis-legal/",
    "/conservatori/preguntes-frequents": "/conservatori/preguntes-frequents/",
    "/conservatori/fundacio": "/conservatori/fundacio/",
    "/home": "/"
  };
  var p = decodeURIComponent(location.pathname).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\/+$/, "");
  var to = map[p];
  if (!to && p && p.slice(-1) !== "/") {
    // qualsevol altra ruta sense barra final: prova-la amb barra
    var candidates = ["/actualitat", "/calendari", "/estudis", "/estudis/documents", "/estudis/espai-portocolom", "/activitats", "/activitats/cor-jove", "/conservatori", "/conservatori/professorat", "/conservatori/normativa", "/conservatori/contacte"];
    if (candidates.indexOf(p) > -1) to = p + "/";
  }
  if (to && to !== location.pathname) location.replace(to + location.hash);
})();
</script>
